# ELETTROFONI — scarica una foto (o una registrazione) libera e la committa nel repo.
# Serve quando il container di sviluppo è rate-limitato da Wikimedia/Flickr:
# i runner GitHub hanno IP puliti. Solo lancio manuale (maintainer).
name: Scarica foto

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL diretto della foto (verificare prima la licenza!)'
        required: false
        default: ''
        type: string
      dest:
        description: 'Percorso di destinazione nel repo (es. assets/foto/x/principale.jpg)'
        required: false
        default: ''
        type: string
      lista:
        description: 'In alternativa: file del repo con una riga «dest url» per ogni file (tutto in UN commit)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica e committa
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.dest }}
          LISTA: ${{ inputs.lista }}
        run: |
          # LEZIONE IMPARATA (28/10/2026): un rifornimento sono una ventina di
          # file, cioè venti run e venti commit che si contendono il ramo
          # vicino alle pubblicazioni. Con `lista` è un run e un commit solo.
          if [ -n "$LISTA" ]; then cp "$LISTA" /tmp/lista.txt; else echo "$DEST $URL" > /tmp/lista.txt; fi
          FILES=""
          while read -r D U; do
            [ -z "$D" ] && continue
            mkdir -p "$(dirname "$D")"
            curl -sSL --fail --retry 3 --retry-delay 5 -A "ElettrofoniBot/1.0 (+https://github.com/${{ github.repository }})" -o "$D" "$U"
            FILETYPE=$(file -b --mime-type "$D")
            echo "Scaricato $D: $(stat -c%s "$D") byte, tipo $FILETYPE"
            # Dal 07/10/2026 anche le registrazioni vere per i reel (Commons
            # le serve come Ogg/FLAC/WAV/MP3): stessa via, stesso controllo.
            case "$FILETYPE" in image/*|audio/*|application/ogg|video/ogg) ;; *) echo "NON è un'immagine né un audio ($FILETYPE): mi fermo"; exit 1;; esac
            FILES="$FILES $D"
            sleep 2
          done < /tmp/lista.txt
          git config user.name "elettrofoni-bot"
          git config user.email "actions@users.noreply.github.com"
          git add $FILES
          git diff --cached --quiet && exit 0
          git commit -m "foto: ${LISTA:-$DEST}"
          # LEZIONE IMPARATA (23/09/2026): con un push secco due scarichi
          # lanciati insieme si scontrano e il secondo muore per
          # non-fast-forward, quindi si potevano fare solo in fila. Lo
          # stesso riallinea-e-riprova che sta in pubblica.yml permette di
          # scaricare le foto di una scheda tutte insieme.
          # Con DIECI run in parallelo cinque tentativi non sono bastati:
          # uno si e' arreso mentre gli altri nove si passavano il ramo.
          # Ora otto tentativi e un'attesa sfasata a caso, cosi' due run
          # respinti insieme non tornano a bussare nello stesso istante.
          for i in 1 2 3 4 5 6 7 8; do
            git push && exit 0
            echo "push respinto, mi riallineo (tentativo $i)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $(( i * 3 + RANDOM % 5 ))
          done
          echo "push fallito dopo 8 tentativi"; exit 1
