# ELETTROFONI — scarica una foto libera e la committa nel repo.
# Serve quando il container di sviluppo è rate-limitato da Wikimedia/Flickr:
# i runner GitHub hanno IP puliti. Solo lancio manuale (maintainer).
name: Scarica foto

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL diretto della foto (verificare prima la licenza!)'
        required: true
        type: string
      dest:
        description: 'Percorso di destinazione nel repo (es. assets/foto/x/principale.jpg)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica e committa
        run: |
          mkdir -p "$(dirname "${{ inputs.dest }}")"
          curl -sSL -A "ElettrofoniBot/1.0 (+https://github.com/${{ github.repository }})" \
            -o "${{ inputs.dest }}" "${{ inputs.url }}"
          FILETYPE=$(file -b --mime-type "${{ inputs.dest }}")
          echo "Scaricato: $(stat -c%s "${{ inputs.dest }}") byte, tipo $FILETYPE"
          case "$FILETYPE" in image/*) ;; *) echo "NON è un'immagine: mi fermo"; exit 1;; esac
          git config user.name "elettrofoni-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ inputs.dest }}"
          git diff --cached --quiet && exit 0
          git commit -m "foto: ${{ inputs.dest }}"
          # LEZIONE IMPARATA (23/09/2026): con un push secco due scarichi
          # lanciati insieme si scontrano e il secondo muore per
          # non-fast-forward, quindi si potevano fare solo in fila. Lo
          # stesso riallinea-e-riprova che sta in pubblica.yml permette di
          # scaricare le foto di una scheda tutte insieme.
          # Con DIECI run in parallelo cinque tentativi non sono bastati:
          # uno si e' arreso mentre gli altri nove si passavano il ramo.
          # Ora otto tentativi e un'attesa sfasata a caso, cosi' due run
          # respinti insieme non tornano a bussare nello stesso istante.
          for i in 1 2 3 4 5 6 7 8; do
            git push && exit 0
            echo "push respinto, mi riallineo (tentativo $i)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $(( i * 3 + RANDOM % 5 ))
          done
          echo "push fallito dopo 8 tentativi"; exit 1
