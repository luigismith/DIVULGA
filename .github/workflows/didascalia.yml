# ELETTROFONI — prova se l'API consente di cambiare la didascalia di un
# post già pubblicato (lancio manuale). In modalità «prova» rimanda la
# stessa didascalia: nessun cambio visibile.
name: Prova didascalia

on:
  workflow_dispatch:
    inputs:
      media_id:
        description: 'ID del post'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python didascalia.py --prova "${{ inputs.media_id }}"
