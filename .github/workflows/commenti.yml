# ELETTROFONI — legge i commenti (lancio manuale, sola lettura).
# Il token sta solo nei secrets: una sessione di presidio i commenti li
# legge da qui, nel log. Non risponde e non segna niente come visto.
name: Leggi commenti

on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Quanti post recenti guardare'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  commenti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python commenti.py --tutti --post "${{ inputs.post }}"
