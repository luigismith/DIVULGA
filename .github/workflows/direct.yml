# ELETTROFONI — conta i messaggi diretti nuovi (lancio manuale, sola lettura).
# Il log di un repo pubblico lo legge chiunque: qui si stampano solo due
# numeri, mai nomi o testo (11/11/2026, vedi direct.py).
name: Leggi direct

on:
  workflow_dispatch:
    inputs:
      ore:
        description: 'Messaggi arrivati nelle ultime N ore'
        required: false
        default: '26'
        type: string

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python direct.py "${{ inputs.ore }}"
