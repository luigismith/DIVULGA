# ELETTROFONI — pubblicazione automatica della prossima scheda.
#
# Tutta l'automazione vive qui (GitHub Actions), non in locale: il PC del
# proprietario può restare spento una settimana e la pagina continua.
name: Pubblica scheda

on:
  schedule:
    # Circa le 18:00 italiane, TUTTI I GIORNI (deciso dal proprietario il 26/08/2026).
    # ATTENZIONE: il cron di GitHub è in UTC e IGNORA l'ora legale.
    # Con l'ora legale (CEST, UTC+2) le 18:00 sono le 16:00 UTC.
    #
    # LEZIONE IMPARATA (27/08/2026): qui c'era un solo cron a '0 16 * * *'.
    # Il 26 agosto è partito con 43 minuti di ritardo; il 27 agosto NON è
    # partito affatto e la pagina è rimasta muta. Il cron di GitHub è
    # "best effort": nei momenti di carico gli eventi schedulati vengono
    # ritardati e possono essere SCARTATI del tutto, e il minuto di carico
    # massimo è esattamente lo scoccare dell'ora — cioè il minuto che
    # avevo scelto io. Nessun errore nei log, semplicemente nessun run.
    #
    # Le contromisure, perché una sola non basta:
    #  1. non più allo scoccare dell'ora, ma a un minuto qualsiasi;
    #  2. TRE passate invece di una. Non fanno doppioni: se una ha già
    #     pubblicato, pubblica.py esce da solo per la regola delle 6 ore
    #     minime fra un post e l'altro (uscita pulita, nessun errore,
    #     nessuna issue). Perché la giornata salti davvero, GitHub deve
    #     scartare tutte e tre le passate, non una.
    # L'ultima è tardi apposta: un post alle 21:40 è fuori orario, ma un
    # post fuori orario batte una giornata di silenzio.
    #
    # >>> DAL 25 OTTOBRE 2026 (ritorno all'ora solare, CET, UTC+1) <<<
    # >>> i tre cron vanno spostati a: '50 16', '35 17', '40 20'      <<<
    - cron: '50 15 * * *'   # 17:50 italiane — passata principale
    - cron: '35 16 * * *'   # 18:35 italiane — prima scorta
    - cron: '40 19 * * *'   # 21:40 italiane — ultima spiaggia
  workflow_dispatch:
    inputs:
      forza:
        description: 'Pubblica anche fuori dalla finestra 16-23 (solo se sai perche)'
        required: false
        default: false
        type: boolean
  # Innesco esterno "tira il cordone": chi non ha un token per chiamare
  # l'API puo' comunque far partire la pubblicazione con un push su
  # questo solo file. Le guardie di pubblica.py (finestra oraria, max 2
  # al giorno, 6 ore di distanza) restano valide, quindi non puo' fare
  # danni: se non e' il momento, il run parte e si ferma da solo.
  push:
    paths: ['scatto.txt']

# Mai due pubblicazioni in parallelo (guardia anti-doppione e anti-soft-block)
concurrency:
  group: pubblicazione
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Identità git
        run: |
          git config user.name "elettrofoni-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Controlli automatici sulle schede
        run: python contenuti.py

      # ffmpeg serve per la storia video (audio sintetizzato).
      # LEZIONE IMPARATA (28/08/2026), tre errori in uno:
      #  1. avevo scritto "su ubuntu-latest c'e' gia'". NON C'E'. Non
      #     l'avevo verificato: l'avevo dato per scontato.
      #  2. il controllo era `ffmpeg -version | head -1`. Con la pipe,
      #     bash -e guarda l'uscita di `head`, che vale sempre 0: il passo
      #     stampava "command not found" e passava lo stesso. Un controllo
      #     che non puo' fallire e' peggio di nessun controllo, perche'
      #     dice che va tutto bene.
      #  3. la storia e' "facoltativa per scelta", ma la sua generazione
      #     stava nel percorso critico: ffmpeg mancante ha ucciso la
      #     pubblicazione del giorno. Il megafono ha ammazzato la missione.
      - name: Installa ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version    # niente pipe: se manca, QUI si deve fermare

      - name: Genera le tavole della prossima scheda e l'archivio
        run: |
          python genera_tavole.py --prossima
          # La storia non deve poter bloccare il post: se il video non si
          # genera si va avanti e il publisher ripiega sul JPEG muto.
          # REGOLA DEL PROPRIETARIO (31/08/2026): si genera UN SOLO
          # video, il reel, e quello stesso file fa anche da storia. Prima
          # se ne costruivano due (story.mp4 di 8 s e reel.mp4 di 24 s):
          # doppio lavoro, doppio peso su Pages e due filmati diversi per
          # la stessa scheda. genera_storia_video.py e' stato tolto.
          # Come prima, il video non deve poter bloccare il post.
          python genera_reel.py --prossima \
            || echo "[warn] reel non generato: si prosegue senza"
          python genera_archivio.py
          git add docs
          # LEZIONE IMPARATA (27/08/2026): qui il push era secco, senza
          # riallineamento. Il run e' morto con "! [rejected] (fetch first)"
          # solo perche' nel frattempo era arrivato un commit sul branch —
          # e la pubblicazione del giorno e' saltata per un motivo che non
          # c'entrava niente con la pubblicazione. Una pubblicazione non
          # deve morire perche' qualcuno ha committato: si riallinea e
          # riprova, e fallisce solo se non ce la fa davvero.
          if ! git diff --cached --quiet; then
            git commit -m "tavole: prossima scheda + archivio"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              echo "[warn] push respinto, mi riallineo e ritento ($i/3)"
              sleep 5
            done
            echo "[errore] push fallito dopo 3 tentativi"; exit 1
          fi

      # Le immagini devono essere online PRIMA di chiamare l'API di
      # Instagram (che scarica da URL pubblico): deploy di GitHub Pages.
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        uses: actions/deploy-pages@v4

      - name: Pubblica su Instagram
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Solo chi lancia a mano e spunta la casella scavalca l'orario.
          # Un innesco automatico non manda questo input, quindi per lui
          # la finestra vale eccome.
          FORZA_ORARIO: ${{ inputs.forza && '1' || '0' }}
        run: python pubblica.py

      # Il post e' gia' uscito: da qui in poi nessun errore deve poter
      # far sembrare fallita una pubblicazione riuscita. Stessa logica di
      # riallineamento e riprova del passo precedente.
      - name: Aggiorna l'archivio con il permalink
        run: |
          git pull --rebase --autostash
          python genera_archivio.py
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "archivio: permalink ultima scheda"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              echo "[warn] push respinto, mi riallineo e ritento ($i/3)"
              sleep 5
            done
            echo "[errore] push dell'archivio fallito dopo 3 tentativi"; exit 1
          fi

      # LEZIONE IMPARATA (26/08/2026): due upload-pages-artifact nello stesso
      # run con lo stesso nome danno "409 Conflict: an artifact with this name
      # already exists". Il secondo deve avere un nome proprio, e deploy-pages
      # va puntato su quel nome. Il post era gia' uscito: a fallire era solo
      # l'aggiornamento dell'archivio, che restava indietro di un post.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-archivio
      - name: Redeploy Pages con archivio aggiornato
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-archivio
