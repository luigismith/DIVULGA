# ELETTROFONI — pubblicazione automatica della prossima scheda.
#
# Tutta l'automazione vive qui (GitHub Actions), non in locale: il PC del
# proprietario può restare spento una settimana e la pagina continua.
name: Pubblica scheda

on:
  schedule:
    # Circa le 18:00 italiane, TUTTI I GIORNI (deciso dal proprietario il 26/08/2026).
    # ATTENZIONE: il cron di GitHub è in UTC e IGNORA l'ora legale.
    # Con l'ora legale (CEST, UTC+2) le 18:00 sono le 16:00 UTC.
    #
    # LEZIONE IMPARATA (27/08/2026): qui c'era un solo cron a '0 16 * * *'.
    # Il 26 agosto è partito con 43 minuti di ritardo; il 27 agosto NON è
    # partito affatto e la pagina è rimasta muta. Il cron di GitHub è
    # "best effort": nei momenti di carico gli eventi schedulati vengono
    # ritardati e possono essere SCARTATI del tutto, e il minuto di carico
    # massimo è esattamente lo scoccare dell'ora — cioè il minuto che
    # avevo scelto io. Nessun errore nei log, semplicemente nessun run.
    #
    # Due contromisure, perché una sola non basta:
    #  1. non più allo scoccare dell'ora, ma a un minuto qualsiasi;
    #  2. una seconda passata di scorta più tardi. Non fa doppioni: se il
    #     primo run ha già pubblicato, pubblica.py esce da solo per la
    #     regola delle 6 ore minime fra un post e l'altro (uscita pulita,
    #     nessun errore, nessuna issue). Se invece il primo è stato
    #     scartato, la scorta pubblica e la giornata è salva.
    #
    # >>> DAL 25 OTTOBRE 2026 (ritorno all'ora solare, CET, UTC+1) <<<
    # >>> i due cron vanno spostati a: '50 16 * * *' e '35 17 * * *' <<<
    - cron: '50 15 * * *'   # 17:50 italiane — passata principale
    - cron: '35 16 * * *'   # 18:35 italiane — scorta, se la prima salta
  workflow_dispatch: {}

# Mai due pubblicazioni in parallelo (guardia anti-doppione e anti-soft-block)
concurrency:
  group: pubblicazione
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Identità git
        run: |
          git config user.name "elettrofoni-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Controlli automatici sulle schede
        run: python contenuti.py

      - name: Genera le tavole della prossima scheda e l'archivio
        run: |
          python genera_tavole.py --prossima
          python genera_archivio.py
          git add docs
          # LEZIONE IMPARATA (27/08/2026): qui il push era secco, senza
          # riallineamento. Il run e' morto con "! [rejected] (fetch first)"
          # solo perche' nel frattempo era arrivato un commit sul branch —
          # e la pubblicazione del giorno e' saltata per un motivo che non
          # c'entrava niente con la pubblicazione. Una pubblicazione non
          # deve morire perche' qualcuno ha committato: si riallinea e
          # riprova, e fallisce solo se non ce la fa davvero.
          if ! git diff --cached --quiet; then
            git commit -m "tavole: prossima scheda + archivio"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              echo "[warn] push respinto, mi riallineo e ritento ($i/3)"
              sleep 5
            done
            echo "[errore] push fallito dopo 3 tentativi"; exit 1
          fi

      # Le immagini devono essere online PRIMA di chiamare l'API di
      # Instagram (che scarica da URL pubblico): deploy di GitHub Pages.
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        uses: actions/deploy-pages@v4

      - name: Pubblica su Instagram
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pubblica.py

      # Il post e' gia' uscito: da qui in poi nessun errore deve poter
      # far sembrare fallita una pubblicazione riuscita. Stessa logica di
      # riallineamento e riprova del passo precedente.
      - name: Aggiorna l'archivio con il permalink
        run: |
          git pull --rebase --autostash
          python genera_archivio.py
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "archivio: permalink ultima scheda"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && exit 0
              echo "[warn] push respinto, mi riallineo e ritento ($i/3)"
              sleep 5
            done
            echo "[errore] push dell'archivio fallito dopo 3 tentativi"; exit 1
          fi

      # LEZIONE IMPARATA (26/08/2026): due upload-pages-artifact nello stesso
      # run con lo stesso nome danno "409 Conflict: an artifact with this name
      # already exists". Il secondo deve avere un nome proprio, e deploy-pages
      # va puntato su quel nome. Il post era gia' uscito: a fallire era solo
      # l'aggiornamento dell'archivio, che restava indietro di un post.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-archivio
      - name: Redeploy Pages con archivio aggiornato
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-archivio
