# ELETTROFONI — controlla che l'ultima giornata chiusa abbia pubblicato.
#
# Tutti gli altri allarmi guardano i run e si accorgono di una
# pubblicazione ANDATA MALE. Questo guarda il risultato e si accorge di
# una pubblicazione MAI TENTATA: il 27/08/2026 il cron delle 18:00 è
# stato scartato da GitHub e in Actions non c'era nessun run da guardare.
#
# NON dice «oggi». Fra il 27/08 e il 01/09/2026 nessuna delle cinque
# passate schedulate è partita all'ora prevista — il ritardo minimo è
# stato di due ore — e quattro sono finite dopo la mezzanotte italiana,
# aprendo quattro issue false su una pagina che pubblicava ogni giorno.
# Ora il giorno giudicato è l'ultimo con la finestra di pubblicazione
# chiusa, quindi il ritardo del cron non cambia il verdetto.
name: Sentinella

on:
  schedule:
    - cron: '25 21 * * *'   # 23:25 italiane (mai allo scoccare dell'ora).
                            # Se arriva tardi non fa danni: vedi sopra.
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests
      # La prova gira PRIMA dell'allarme: contiene gli orari veri delle
      # passate che hanno sbagliato, quindi se qualcuno rimette la
      # vecchia regola del «oggi» il workflow si ferma qui.
      - name: La sentinella ragiona ancora bene?
        run: python prova_sentinella.py
      - name: L'ultima giornata chiusa ha pubblicato?
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sentinella.py
