# ELETTROFONI — pubblica UN reel, a comando. Mai automatico.
#
# Il budget video dell'account si consuma anche coi tentativi falliti:
# per questo non c'e' nessun cron qui e non c'e' nessun retry. Si lancia
# a mano, si guarda il risultato, e se e' andata male si aspetta un'ora
# prima di riprovare.
name: Pubblica reel

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug della scheda; vuoto = la piu vecchia senza reel'
        required: false
        default: ''
        type: string

concurrency:
  group: pubblicazione        # mai in parallelo con il post del giorno
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Identita git
        run: |
          git config user.name "elettrofoni-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Pubblica il reel
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pubblica_reel.py "${{ inputs.slug || '--prossimo' }}"
