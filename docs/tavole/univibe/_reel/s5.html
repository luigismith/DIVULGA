/* SCELTA TIPOGRAFICA (13/09/2026, richiesta dal proprietario: «usa coppie
   di font compatibili»). Prima c'erano due sole facce e tutta la prosa
   lunga stava in IBM Plex Mono a 28-30px: il monospazio e' una faccia da
   DATI, e su otto righe di racconto stanca l'occhio e fa sembrare la
   tavola un terminale invece di una pagina di catalogo.
   Ora i ruoli sono tre:
     Oswald      -> display: nome della macchina, titoli, numeroni, valori
     PlexSerif   -> testo corrente, tutta la prosa (il gancio in corsivo)
     PlexMono    -> solo dati: etichette, sigle, specifiche, fonti, crediti
   Il serif e' della STESSA superfamiglia del mono: stesso scheletro,
   stessa altezza-x, disegnati per stare insieme. La compatibilita' della
   coppia e' una proprieta' del disegno, non un'opinione. */
@font-face{font-family:'PlexSerif';src:url(file:///home/runner/work/DIVULGA/DIVULGA/template/fonts/IBMPlexSerif-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:'PlexSerif';src:url(file:///home/runner/work/DIVULGA/DIVULGA/template/fonts/IBMPlexSerif-600.woff2) format('woff2');font-weight:600}
@font-face{font-family:'PlexSerif';src:url(file:///home/runner/work/DIVULGA/DIVULGA/template/fonts/IBMPlexSerif-400i.woff2) format('woff2');font-weight:400;font-style:italic}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#f4e9d2;color:#38291d;
  font-family:'Oswald';display:flex;flex-direction:column;position:relative}
/* La testata e' un marchio, non un'intestazione: 66px. Era 117 e su
   sei tavole uguali pesava come la riga di un modulo. */
.testata{flex:none;height:66px;background:#38291d;color:#f4e9d2;padding:0 44px;
  display:flex;align-items:center;justify-content:space-between}
.blocco-logo{display:flex;align-items:center;gap:16px}
.quadratino{width:38px;height:38px;background:#d9702e;display:flex;align-items:center;justify-content:center;flex:none}
.quadratino svg{width:27px;height:27px}
.nome{font-weight:700;font-size:30px;letter-spacing:.14em;line-height:1}
.serie{text-align:right;font-family:'PlexMono';font-size:12px;letter-spacing:.14em;line-height:1.6;color:#e9d9b8}
.strip{flex:none;height:6px;background:#d9702e}
.corpo{flex:1;position:relative;display:flex;flex-direction:column;min-height:0}
.kicker{font-family:'PlexMono';font-weight:600;font-size:15px;letter-spacing:.24em;color:#d9702e}
/* Intesta di sezione: numerone arancio + etichetta + titolo, su una riga
   di base comune. E' l'unico ornamento delle tavole interne, e porta
   informazione (a che punto del carosello sei). */
.intesta{flex:none;display:flex;align-items:flex-end;gap:24px;margin:28px 52px 0;
  padding-bottom:16px;border-bottom:3px solid #38291d}
.numerone{flex:none;font-weight:700;font-size:104px;line-height:.78;color:#d9702e;letter-spacing:-.03em}
.intesta-testi{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
/* LEZIONE IMPARATA: un titolo dentro un contenitore flex viene compresso
   e l'autofit lo taglia — quindi flex:none sui titoli, sempre. */
.titolo,.titolone{flex:none;font-weight:700;font-size:50px;line-height:1;text-transform:uppercase}
.testo{font-family:'PlexSerif';font-size:34px;line-height:1.5;margin:22px 52px 0;overflow:hidden;min-height:0}
/* Foto a tutta larghezza. `multiply` fonde la foto con la carta: i
   ritagli su fondo bianco (la maggioranza, su Commons) non galleggiano
   piu' in un rettangolo bianco sulla crema. */
.fotobanda{flex:none;position:relative;overflow:hidden;background:#f4e9d2;display:flex;align-items:center;justify-content:center}
.fotobanda img{display:block;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.didascalia{position:absolute;left:52px;bottom:16px;background:#d9702e;color:#38291d;
  font-family:'PlexMono';font-weight:600;font-size:13px;letter-spacing:.14em;padding:7px 12px}
/* Il credito e' un obbligo di licenza, non una decorazione: su una foto
   chiara il grigio all'80% spariva. Fondino scuro e testo pieno. */
.credito{position:absolute;right:0;bottom:0;font-family:'PlexMono';font-size:11px;
  color:#f4e9d2;letter-spacing:.04em;background:rgba(20,14,9,.66);padding:5px 10px}
.pager{flex:none;margin:auto 52px 0;display:flex;align-items:center;justify-content:space-between;
  border-top:3px solid #38291d;padding:14px 0 20px;font-family:'PlexMono';font-weight:600;font-size:14px;letter-spacing:.16em}
.pager .num{color:#d9702e}
.pager .qui{font-family:'Oswald';font-weight:700;font-size:22px;letter-spacing:.04em}
.zoccolo{flex:none;background:#d9702e;color:#38291d;padding:18px 52px;display:flex;align-items:center;justify-content:space-between}
.motto{font-family:'PlexMono';font-weight:600;font-size:15px;letter-spacing:.12em}
.handle{font-weight:700;font-size:22px;letter-spacing:.14em}
.autofit{min-height:0}

body{width:1080px;height:1920px}
/* Nel carosello il testo parte dall'alto e va bene: chi legge scorre.
   In un reel no — restano quattro secondi e un buco di schermo vuoto
   sotto sembra una diapositiva non finita. Qui si centra tutto. */
.corpo{padding:70px;justify-content:center}
.kicker{font-size:24px;letter-spacing:.22em}
.grande{flex:none;font-weight:700;text-transform:uppercase;line-height:1.02;
  font-size:104px;margin-top:26px}
/* Prosa in serif, come sulle tavole (tre ruoli tipografici, 13/09/2026):
   il mono resta a etichette e dati. */
.media{flex:none;font-family:'PlexSerif';font-size:42px;line-height:1.45;margin-top:34px}
.pieno{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.velo{position:absolute;inset:0;background:linear-gradient(180deg,
  rgba(56,41,29,.25) 0%, rgba(56,41,29,.55) 45%, rgba(56,41,29,.92) 100%)}
.sopra{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
  padding:70px;color:#f4e9d2}
.sopra .grande{color:#f4e9d2;margin-top:auto}
.sopra .kicker{color:#d9702e}
.sopra .coda{flex:none;font-family:'PlexMono';font-size:30px;margin-top:24px;color:#e9d9b8}
.figure{flex:none;margin-top:40px}
.fig{display:flex;align-items:baseline;gap:26px;border-bottom:3px solid #38291d;padding:30px 0}
.fig .n{font-family:'PlexMono';font-weight:600;font-size:26px;color:#d9702e;flex:none}
.fig .v{font-weight:700;font-size:52px;text-transform:uppercase;line-height:1.05}
.riquadro{flex:none;border:4px solid #38291d;background:#e9d9b8;padding:44px 48px}
.riquadro .et{font-family:'PlexMono';font-weight:600;font-size:24px;letter-spacing:.2em;color:#d9702e;margin-bottom:18px}
.riquadro .t{font-weight:700;font-size:56px;line-height:1.1}
.riquadro .s{font-family:'PlexSerif';font-size:34px;line-height:1.45;margin-top:18px}
.chiusa{flex:none;margin-top:70px;text-align:center}
.chiusa .firma{font-weight:700;font-size:64px;line-height:1.1;text-transform:uppercase}
.chiusa .cta{font-family:'PlexMono';font-size:34px;margin-top:34px;color:#d9702e}
.chiusa .tag{font-weight:700;font-size:52px;letter-spacing:.1em;margin-top:26px}
.avviso{justify-content:center}
.avviso .automa{flex:none;margin-top:40px}
.avviso .automa svg{width:200px;height:200px}
.avviso .grande{font-size:80px;margin-top:30px}
.domanda{justify-content:center;text-align:center}
.domanda .kicker{color:#d9702e}
/* La domanda deve essere la cosa piu' grande della schermata: e' l'unica
   ragione per cui questa scena esiste. flex:none perche' dentro un flex
   verrebbe compressa e l'autofit la rimpicciolirebbe fino a sparire —
   e' il primo errore del progetto, gia' scritto nel CSS di base. */
.domanda .grande{flex:none;height:auto;font-size:96px;line-height:1.06;margin-top:34px}
.domanda .chiusa{margin-top:96px}
.domanda .chiusa .firma{font-size:30px;letter-spacing:.05em;color:#6b5138}
.domanda .chiusa .tag{font-size:62px;margin-top:20px}
</style></head>

  <div class="riquadro"><div class="et">DA ASCOLTARE</div><div class="t">Robin Trower<br>«Bridge of Sighs» (1974)</div><div class="s">Il pezzo che dà il titolo all'album: ascoltate come l'oscillazione dell'Uni-Vibe si muove insieme alla nota, non sopra.</div></div>
</div><script>
// Autofit: rimpicciolisce il carattere finché il testo entra nel suo
// contenitore. Gira dopo il caricamento dei font E delle immagini:
// data-pronto su fonts.ready poteva scattare prima del decode della foto.
Promise.all([document.fonts.ready,
             ...Array.from(document.images).map(i => i.decode().catch(() => null))]).then(() => {
  for (const el of document.querySelectorAll('.autofit')) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    const min = parseFloat(el.dataset.min || '18');
    while ((el.scrollHeight > el.clientHeight || el.scrollWidth > el.clientWidth) && size > min) {
      size -= 1;
      el.style.fontSize = size + 'px';
    }
  }
  // Riquadri adattivi (copertina, storia): la foto riempie lo spazio che
  // resta, ma il ritaglio e' limitato a data-cap (1.25 = si perde al
  // massimo il 20% del lato lungo). Oltre, meglio un bordo di crema che
  // una macchina senza tastiera.
  for (const box of document.querySelectorAll('.fotobanda[data-cap]')) {
    const img = box.querySelector('img');
    if (!img.naturalWidth) continue;
    const asp = img.naturalWidth / img.naturalHeight;
    const cap = parseFloat(box.dataset.cap);
    const h = Math.min(box.clientHeight, box.clientWidth / asp * cap);
    img.style.height = Math.round(h) + 'px';
  }
  document.body.dataset.pronto = '1';
});
</script></body></html>
